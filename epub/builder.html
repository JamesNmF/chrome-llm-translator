<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPUB 电子书双语制作 - 简易LLM翻译插件</title>
  <link rel="stylesheet" href="builder.css">
  <script src="../lib/jszip.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航 -->
    <header class="header">
      <div class="header-left">
        <img src="../icons/icon48.png" alt="Logo" class="logo">
        <div>
          <h1>EPUB 电子书双语制作</h1>
          <span class="sub-title">将外文 EPUB 电子书翻译并导出为双语版本</span>
        </div>
      </div>
      <div class="header-right">
        <span class="badge" id="current-model-tag">DeepSeek</span>
      </div>
    </header>

    <main class="main-content">
      <!-- 1. 文件拖拽上传区 -->
      <section class="card upload-card" id="upload-section">
        <div class="drop-zone" id="drop-zone">
          <div class="upload-icon">📚</div>
          <h3>选择或拖入 .epub 电子书文件</h3>
          <p>支持常见外文电子书解析与双语对照排版</p>
          <button class="btn btn-primary btn-large" id="btn-select-file">选择本地 EPUB 文件</button>
          <input type="file" id="file-input" accept=".epub" style="display: none;">
        </div>
      </section>

      <!-- 2. 书籍信息与章节选择区 -->
      <section class="card book-card hidden" id="book-section">
        <div class="book-meta">
          <div class="book-cover-wrap" id="cover-wrap">
            <div class="no-cover">无封面</div>
          </div>
          <div class="book-info">
            <h2 id="book-title">书名加载中...</h2>
            <p class="book-author" id="book-creator">作者: 未知</p>
            <p class="book-chapters-count" id="book-chapter-count">共 0 个章节</p>
            
            <div class="config-bar">
              <div class="config-item">
                <label>目标语言:</label>
                <select id="select-target-lang" class="form-control">
                  <option value="zh-CN">简体中文</option>
                  <option value="zh-TW">繁體中文</option>
                  <option value="en">English</option>
                  <option value="ja">日本語</option>
                </select>
              </div>
              <div class="config-item">
                <label>双语对照风格:</label>
                <select id="select-theme" class="form-control">
                  <option value="dashed">点线虚线</option>
                  <option value="highlight">高亮标注</option>
                  <option value="dim_origin">弱化原文</option>
                  <option value="blockquote">引用框</option>
                  <option value="simple">自然段落</option>
                </select>
              </div>
            </div>

            <div class="action-buttons">
              <button class="btn btn-success btn-large" id="btn-start-translate">
                <span>开始翻译制作</span>
              </button>
              <button class="btn btn-secondary" id="btn-reselect">重新选择</button>
            </div>
          </div>
        </div>

        <!-- 章节列表与勾选 -->
        <div class="chapters-wrapper">
          <div class="chapters-header">
            <h3>章节选择 (<span id="selected-count">0</span>/<span id="total-count">0</span>)</h3>
            <div class="chapter-actions">
              <button class="tool-btn" id="btn-select-all">全选</button>
              <button class="tool-btn" id="btn-select-none">清空</button>
            </div>
          </div>
          <div class="chapter-list" id="chapter-list">
            <!-- 动态填充章节 -->
          </div>
        </div>
      </section>

      <!-- 3. 制作进度与日志区 -->
      <section class="card progress-card hidden" id="progress-section">
        <div class="progress-header">
          <h3 id="progress-status-title">正在翻译制作双语电子书...</h3>
          <span class="progress-percent" id="progress-percent-text">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>

        <div class="log-box" id="log-box">
          <div class="log-item">就绪...</div>
        </div>

        <div class="progress-actions">
          <button class="btn btn-danger" id="btn-stop-translate">停止翻译</button>
          <button class="btn btn-primary hidden" id="btn-download-epub">
            <span>📥 下载双语 EPUB 文件</span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="builder.js"></script>
</body>
</html>
