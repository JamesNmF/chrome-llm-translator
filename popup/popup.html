<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM 翻译官</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container" id="app-container">
    <!-- 拖拽 PDF 进入 Popup 时的全屏提示蒙层 -->
    <div class="popup-drop-overlay" id="popup-drop-overlay">
      <div class="popup-drop-box">
        <div style="font-size: 36px; margin-bottom: 6px;">📄</div>
        <div style="font-weight: 700; font-size: 14px; color: #4f46e5;">松开直接打开 PDF</div>
        <div style="font-size: 11.5px; color: #64748b; margin-top: 4px;">自动进入双语阅读器</div>
      </div>
    </div>

    <!-- 头部 -->
    <header class="header">
      <div class="header-brand">
        <img src="../icons/icon48.png" alt="Logo" class="logo">
        <div>
          <h1 class="title">LLM 翻译官</h1>
          <span class="provider-tag" id="current-model-tag">DeepSeek</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-open-docx" title="打开 Word (.docx) 双语制作器">📝</button>
        <button class="icon-btn" id="btn-open-pdf" title="打开 PDF 阅读器">📑</button>
        <button class="icon-btn" id="btn-open-epub" title="打开 EPUB 制作器">📚</button>
        <button class="icon-btn" id="btn-history" title="翻译历史">
          <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        </button>
        <button class="icon-btn" id="btn-open-options" title="设置中心">
          <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </header>

    <!-- 🌐 当前网页翻译控制面板 (显示原文 / 双语对照 / 仅看译文) -->
    <div class="web-translate-panel">
      <div class="web-translate-header">
        <span class="web-panel-title">🌐 当前网页翻译控制</span>
        <span class="web-state-badge" id="web-page-state">就绪 (Alt+A)</span>
      </div>
      <div class="web-view-buttons">
        <button class="view-btn active" id="btn-view-origin" data-view="origin" title="恢复网页原始外文">
          <span>📄 原文</span>
        </button>
        <button class="view-btn" id="btn-view-dual" data-view="dual" title="同时显示原文与中文译文">
          <span>📑 双语对照</span>
        </button>
        <button class="view-btn" id="btn-view-trans" data-view="translation" title="仅显示中文译文">
          <span>✨ 仅看译文</span>
        </button>
      </div>
    </div>

    <!-- 模式选项卡 -->
    <div class="modes-bar" id="modes-container"></div>

    <!-- 语言选择栏 -->
    <div class="lang-bar">
      <select id="source-lang-select" class="lang-select">
        <option value="auto">🌐 自动检测</option>
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
      </select>

      <button class="icon-btn swap-btn" id="btn-swap-lang" title="交换语言">⇄</button>
      <select id="target-lang-select" class="lang-select"></select>
    </div>

    <!-- 主工作区 -->
    <main class="workspace">
      <!-- 输入区域 (支持直接输入文本或拖入 PDF) -->
      <div class="input-card">
        <textarea id="source-input" placeholder="输入要翻译的文本... 或直接把 PDF 文件拖到这里打开" rows="4"></textarea>
        <div class="input-footer">
          <div class="input-tools">
            <button class="tool-btn" id="btn-clear" title="清空输入">清空</button>
            <button class="tool-btn" id="btn-paste" title="从剪贴板粘贴">粘贴</button>
            <span class="char-count" id="char-count">0 字</span>
          </div>
          <button class="submit-btn" id="btn-translate">
            <span>翻译</span>
            <kbd>Ctrl+↵</kbd>
          </button>
        </div>
      </div>

      <!-- 输出区域 -->
      <div class="output-card">
        <div class="output-header">
          <span class="output-title">译文</span>
          <div class="output-actions">
            <button class="tool-btn" id="btn-speak-target" title="朗读译文">🔊 朗读</button>
            <button class="tool-btn primary" id="btn-copy-target" title="复制译文">📋 复制</button>
          </div>
        </div>
        <div class="output-content" id="output-content">
          <div class="empty-placeholder">
            <span>✨ 输入文本后点击“翻译”或按 <kbd>Ctrl+Enter</kbd></span>
          </div>
        </div>
        <div class="output-footer" id="output-status">就绪</div>
      </div>
    </main>

    <!-- 历史记录抽屉 -->
    <div class="history-drawer" id="history-drawer">
      <div class="drawer-header">
        <h3>翻译历史</h3>
        <div class="drawer-actions">
          <button class="tool-btn" id="btn-clear-history">清空</button>
          <button class="icon-btn" id="btn-close-history">✕</button>
        </div>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
